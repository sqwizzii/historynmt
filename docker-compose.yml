services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nmt_history_db
      POSTGRES_USER: nmt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD у файлі .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmt -d nmt_history_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/nmt_history_db
      DB_USERNAME: nmt
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET у файлі .env}
      BOOTSTRAP_TEACHER_ENABLED: ${BOOTSTRAP_TEACHER_ENABLED:-false}
      BOOTSTRAP_TEACHER_PASSWORD: ${BOOTSTRAP_TEACHER_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?Задайте PUBLIC_URL у файлі .env}
      LEGACY_TEACHER_USERNAME: ${LEGACY_TEACHER_USERNAME:-}
      LEGACY_ASSIGN_ALL_STUDENTS: ${LEGACY_ASSIGN_ALL_STUDENTS:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PROMOTE_EXISTING: ${ADMIN_PROMOTE_EXISTING:-false}
      IMPORT_ZNO_ENABLED: ${IMPORT_ZNO_ENABLED:-false}
      IMAGE_URL_TTL_MINUTES: ${IMAGE_URL_TTL_MINUTES:-360}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
