spring:
  application:
    name: nmt-history
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nmt_history_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  jwt:
    # Base64-кодований секрет (мінімум 256 біт). У production задавайте через JWT_SECRET.
    secret: ${JWT_SECRET:bm10LWhpc3RvcnktZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbg==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Дозволені origin-и фронтенду (через кому). У production задавайте через CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:45173,http://127.0.0.1:45173}
  bootstrap-teacher:
    # Необов'язковий початковий акаунт вчителя: створюється лише при BOOTSTRAP_TEACHER_ENABLED=true і заданому паролі.
    enabled: ${BOOTSTRAP_TEACHER_ENABLED:false}
    username: ${BOOTSTRAP_TEACHER_USERNAME:teacher}
    email: ${BOOTSTRAP_TEACHER_EMAIL:teacher@nmt-history.local}
    password: ${BOOTSTRAP_TEACHER_PASSWORD:}
  legacy:
    # Власник даних, створених до запровадження власності матеріалів (див. LegacyOwnershipInitializer).
    # Лише явна конфігурація: login існуючого користувача з роллю TEACHER. Без неї власники не призначаються.
    teacher-username: ${LEGACY_TEACHER_USERNAME:}
    # Підтвердження прив'язки всіх неприв'язаних учнів до цього вчителя, якщо в БД є кілька вчителів.
    assign-all-students: ${LEGACY_ASSIGN_ALL_STUDENTS:false}
    # true: за недостатньої конфігурації застосунок не стартує (production); false: лише попередження.
    strict: ${LEGACY_STRICT:false}
  admin:
    # Окремий акаунт адміністратора. Пароль лише зі змінної середовища/сховища секретів, значення за замовчуванням немає.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    promote-existing: ${ADMIN_PROMOTE_EXISTING:false}
  import:
    # Імпорт за посиланням: лише дозволені домени. Джерело zno.osvita.ua вимкнене, бо угода сайту забороняє копіювання
    # без письмового дозволу; вмикайте IMPORT_ZNO_ENABLED=true лише за наявності такого дозволу.
    zno-enabled: ${IMPORT_ZNO_ENABLED:false}
    allowed-hosts: zno.osvita.ua
    timeout-seconds: 10
  images:
    url-ttl-minutes: ${IMAGE_URL_TTL_MINUTES:360}
  login:
    # Обмеження спроб входу: після max-failures невдалих спроб вхід блокується на window-minutes хвилин.
    max-failures: ${LOGIN_MAX_FAILURES:5}
    window-minutes: ${LOGIN_WINDOW_MINUTES:10}
