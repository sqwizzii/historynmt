# Профіль production: усі секрети обов'язкові (без значень за замовчуванням),
# застосунок не стартує, якщо змінну середовища не задано.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
  bootstrap-teacher:
    password: ${BOOTSTRAP_TEACHER_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  legacy:
    strict: true
